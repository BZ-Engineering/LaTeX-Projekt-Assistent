name: Release bauen

# Bei einem Tag wie "v1.0.0" werden alle Pakete gebaut und als Release veröffentlicht.
# Manuell (Reiter Actions → "Release bauen" → "Run workflow") werden sie nur als Artefakte gebaut.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ziel: exe
            datei: downloads/LaTeX-Projekt-Assistent-Windows.exe
          - os: macos-latest
            ziel: app
            datei: downloads/LaTeX-Projekt-Assistent-macOS.zip
          - os: ubuntu-latest
            ziel: zip
            datei: downloads/LaTeX-Projekt-Assistent-Python.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: PyInstaller installieren
        if: matrix.ziel != 'zip'
        run: python -m pip install pyinstaller
      - name: Paket bauen
        run: python werkzeuge/pakete_bauen.py ${{ matrix.ziel }}
      - uses: actions/upload-artifact@v5
        with:
          name: paket-${{ matrix.ziel }}
          path: ${{ matrix.datei }}

  release:
    needs: bauen
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: pakete
          merge-multiple: true
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la pakete
          gh release create "$GITHUB_REF_NAME" pakete/* \
            --title "LaTeX-Projekt-Assistent ${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md --latest
